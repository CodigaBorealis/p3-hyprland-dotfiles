
background {
    monitor = 
    path = /home/line/wallpapers/p1r32kpwmupf1 (2).png
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2 # 0 disables blurring
}
image {
    monitor =
    path = /home/line/wallpapers/Portrait.aigis.png
    size = 150
    rounding = -1 
    border_size = 0
    position = 0, 140
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    placeholder_text = Input your "password"
    inner_color = rgba(0, 0, 0, 0.0) # no fill
    
    outer_color = rgba(63dbffff) rgba(ffdb63ff) 45deg
    check_color=rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color=rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(255, 254, 254)
    font_family = JetBrainsMonoNF Regular
    fade_on_empty = false
    rounding = 15

    position = 0, -20
    halign = center
    valign = center
}
label {
    monitor =
    text = Hi "$USER" as they say.
    color = #fffefe
    font_size = 15
    font_family = JetBrainsMonoNF Regular

    position = 0, 10
    halign = center
    valign = bottom
}


